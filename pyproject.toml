[project]
name = "boomerang"
version = "0.1.0"
description = "Turn a personal inbox into a reimbursement packet."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "playwright==1.63.0",
    "pypdf==6.19.0",
]

[project.optional-dependencies]
gmail = [
    "google-api-python-client==2.200.0",
    "google-auth-oauthlib==1.4.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.7",
    "diff-cover==10.5.1",
    "pre-commit==4.6.2",
]

[tool.uv]
# boomerang is an agent skill, not a built or published package; uv sync has
# nothing to build, so it must not require a build backend.
package = false

[tool.pytest.ini_options]
# ``examples`` carries synth.py, the PNG, PDF and money writers the fixture
# generator and the worked example both build their receipts with.
pythonpath = ["scripts", "tests", "examples"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["scripts"]
omit = ["scripts/gmail_cli.py"]
# greenlet for the playwright render, thread for the pools in fetch.py and
# clean.py. Without thread, work done in a worker reads as never run at all.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
# The floor the suite already clears with room to spare; diff-cover holds
# changed lines to the same 90 percent in CI. Below 100, on purpose: the
# runtime depends on playwright and pypdf (STR-001 does not hold here, see
# the pull request body), so this repo stays at the build stage rather than
# the finish stage a 100 floor would trigger.
fail_under = 90
