[project]
name = "boomerang"
version = "0.1.0"
description = "Turn a personal inbox into a reimbursement packet."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "playwright==1.49.1",
    "pypdf==5.1.0",
]

[project.optional-dependencies]
gmail = [
    "google-api-python-client==2.155.0",
    "google-auth-oauthlib==1.2.1",
]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
    "diff-cover==9.2.0",
    "pre-commit==4.0.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["scripts"]
omit = ["scripts/gmail_cli.py"]
concurrency = ["greenlet"]
