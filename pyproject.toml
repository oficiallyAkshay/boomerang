[project]
name = "boomerang"
version = "0.1.0"
description = "Turn a personal inbox into a reimbursement packet."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "playwright==1.63.0",
    "pypdf==6.19.0",
]

[project.optional-dependencies]
gmail = [
    "google-api-python-client==2.200.0",
    "google-auth-oauthlib==1.4.1",
]
# Optional, never required: the compaction step in fetch.py imports headroom
# only when --compact is passed. The bare package is taken rather than
# headroom-ai[all], whose ML extras pull transformers and the tree-sitter
# language pack for features nothing here uses.
compact = [
    "headroom-ai==0.37.0",
]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.7",
    "diff-cover==10.5.1",
    "pre-commit==4.6.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["scripts"]
omit = ["scripts/gmail_cli.py"]
# greenlet for the playwright render, thread for the pools in fetch.py and
# clean.py. Without thread, work done in a worker reads as never run at all.
concurrency = ["greenlet", "thread"]
