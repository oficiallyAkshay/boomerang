# GitHub disables a scheduled workflow on a public repository after 60 days
# with no commit to the repository; any commit, on any branch, resets that
# clock, so a repository that commits regularly never sees this schedule
# stop.
name: clonometer
on:
  schedule: [{cron: "17 * * * *"}]
  workflow_dispatch:
permissions: {}
concurrency: {group: clonometer}
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The action uses TRAFFIC_TOKEN for its reads and writes. The workflow
    # token only opens the failure issue below.
    permissions:
      issues: write
    steps:
      - uses: oficiallyAkshay/clonometer@b1cc1b48ac9a6a38ae505cf060a0a1de82682413 # v1.2.0
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}
          runs-per-day: ${{ vars.CLONOMETER_RUNS_PER_DAY }}
          metrics: clones,views
      # A failed run opens one issue, or comments on the one already open.
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The nightly clonometer run failed"
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "$RUN_URL"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$RUN_URL"
          fi
