<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 423" width="1200" height="423" role="img" aria-labelledby="flow-title">
  <title id="flow-title">Inbox and calendar feed receipts of every kind into one PDF packet with the receipts behind the summary</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
