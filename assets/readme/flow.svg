      <path d="M14,0 L14,12"></path>
      <path d="M38,0 L38,12"></path>
      <path d="M14,28 L14,30"></path>
      <path d="M26,28 L26,30"></path>
      <path d="M38,28 L38,30"></path>
    </g>
    <text class="title" x="114" y="342" font-size="20" text-anchor="middle">Calendar</text>
  </g>

