  <path class="flow" d="M210,305 C 262,305 300,262 336,220" marker-end="url(#arrow)"></path>
  <text class="muted" x="276" y="100" font-size="16" text-anchor="middle">receipts</text>
  <text class="muted" x="276" y="338" font-size="16" text-anchor="middle">trip dates</text>
  <circle cx="352" cy="205" r="6" fill="#d97706"></circle>

