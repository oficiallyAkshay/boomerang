      .title-faint { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #64748b; font-weight: 600; }
      .muted { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #7f8ea3; font-weight: 500; }
      .flow { fill: none; stroke: #d97706; stroke-width: 2; }
