      <rect x="922" y="172" width="80" height="8" rx="4"></rect><rect x="1050" y="172" width="40" height="8" rx="4"></rect>
      <rect x="922" y="198" width="104" height="8" rx="4"></rect><rect x="1050" y="198" width="40" height="8" rx="4"></rect>
      <rect x="922" y="224" width="72" height="8" rx="4"></rect><rect x="1050" y="224" width="40" height="8" rx="4"></rect>
      <rect x="922" y="250" width="92" height="8" rx="4"></rect><rect x="1050" y="250" width="40" height="8" rx="4"></rect>
