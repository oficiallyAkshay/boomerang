<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="flow-title">
  <title id="flow-title">Inbox and calendar feed receipts of every kind into one PDF packet with the receipts behind the summary</title>
  <defs>
