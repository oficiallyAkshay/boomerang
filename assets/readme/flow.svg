      .glyph { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
      .title { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; font-weight: 600; }
      .muted { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #7f8ea3; font-weight: 500; }
      .flow { fill: none; stroke: #d97706; stroke-width: 2; }
      .bar { fill: #cbd5e1; }
    </style>
  </defs>

  <g>
    <rect class="card" x="24" y="56" width="180" height="118" rx="14"></rect>
    <g class="glyph" transform="translate(86, 82)">
      <rect x="0" y="0" width="56" height="38" rx="5"></rect>
      <path d="M0,5 L28,24 L56,5"></path>
    </g>
    <text class="title" x="114" y="152" font-size="20" text-anchor="middle">Inbox</text>
  </g>

  <g>
    <rect class="card" x="24" y="246" width="180" height="118" rx="14"></rect>
    <g class="glyph" transform="translate(88, 272)">
