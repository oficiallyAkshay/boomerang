# The same hooks CI runs, run there through pre-commit like these. gitleaks
# is not here: it needs the whole git history to find a secret that was ever
# committed, not just the working tree pre-commit hands a hook, so it runs as
# its own full-history step in ci.yml instead, skipped from this local set.
# actionlint and zizmor are standalone tools pre-commit installs on its own
# and have no pyproject.toml pin to match.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.16.0
    hooks:
      - id: markdownlint-cli2
        args: ["--config", ".github/.markdownlint.json", "--fix"]

  - repo: local
    hooks:
      - id: check-prose
        name: prose and privacy gate
        entry: uv run python scripts/check_prose.py
        language: system
        pass_filenames: false
        always_run: true
